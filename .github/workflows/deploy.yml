# Deploys only a main commit that CI has passed (decision 0012), one deploy
# at a time. The VPS side (/opt/chua/deploy.sh) is documented in
# docs/for-owner/huong_dan/11-cap-nhat-deploy-lai.md.
name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual re-deploy of current main (Actions tab → Deploy to VPS → Run workflow).
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run deploy.sh
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The exact commit CI passed, so a later merge whose CI is still
          # running never rides along. (An older deploy.sh ignores the arg.)
          script: /opt/chua/deploy.sh ${{ github.event.workflow_run.head_sha || github.sha }}
