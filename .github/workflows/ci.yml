# The only reviewer of every PR (decisions 0012, 0014). When server, app and
# docs are green, the automerge job merges the PR and starts the deploy.
# main is not locked on GitHub; a direct push to main still runs this, and
# deploy.yml follows only if it passed, so red code never deploys.
# Never weaken a step to get green — fix the code or the test.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      # `build` runs tsc first, so this is also the typecheck. Same env vars
      # as /opt/chua/deploy.sh, so CI builds what production builds.
      - run: npm run build
        env:
          VITE_PRESENCE_URL: wss://chua.io.vn/ws
          VITE_BOARDS_URL: https://chua.io.vn

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-docs.mjs
      # Report only until the big app files are split; then add --strict.
      - run: node scripts/check-size.mjs

  # ESLint with the root's own dev tools (eslint.config.mjs explains why
  # the root has its own TypeScript).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  # Merges a green PR by itself, then starts the deploy (decision 0014,
  # superseded by 0015: no visual-check gate — every green PR auto-merges,
  # including visual/3D changes).
  # Skipped for drafts and Dependabot (its token cannot merge).
  automerge:
    needs: [server, app, docs, lint]
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      # For a PR, this is GitHub's test merge of the PR into main: the exact
      # code the jobs above passed. Its first parent is the main commit used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Merge if CI tested today's main, then deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # gh talks to the API only, never to this detached checkout
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tested_main=$(git rev-parse HEAD^1)
          main_now=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$tested_main" != "$main_now" ]; then
            # Another PR merged while this one ran: the combination is untested.
            gh pr comment "$PR" --body "Not merged: \`main\` moved while CI ran. Rebase on \`main\` and push; CI runs again and merges by itself when green."
            echo "::warning::main moved since CI ran; not merged"
            exit 0
          fi
          # --match-head-commit: refuse if someone pushed after these checks ran.
          # Read before merging: the PR's "Closes #n" links.
          issues=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          merged=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
          # GitHub skips its own "Closes #n" auto-close when GITHUB_TOKEN merges.
          for issue in $issues; do
            gh issue close "$issue" --comment "Merged in #$PR." || echo "::warning::could not close #$issue"
          done
          # A merge made with GITHUB_TOKEN starts no push workflows, so CI on
          # main and its deploy would never fire; dispatch the deploy directly.
          gh workflow run deploy.yml --ref main -f sha="$merged"
          echo "Merged as $merged, deploy started"
